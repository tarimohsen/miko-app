V.ord=()=>{const t=OT(oc),Sl=(a,v,f)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');return `<h2>${oc.id?'ویرایش سفارش':'سفارش / فاکتور جدید'}</h2><div class="f"><label>مشتری<input list="cl_" value="${esc(oc.c)}" onchange="ocn(this.value)"></label><label>شماره تماس<input dir="ltr" value="${esc(oc.ph)}" onchange="oc.ph=this.value"></label><label>پیج اینستاگرام<input dir="ltr" value="${esc(oc.ig)}" onchange="oc.ig=this.value"></label><label class="w">آدرس مشتری<input value="${esc(oc.ad)}" onchange="oc.ad=this.value"></label><datalist id="cl_">${S.cust.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>
<div class="w box"><b>آیتم‌های سفارش</b>${oc.lines.map((l,i)=>`<div class="c"><div>${esc(l.n)} × ${fm(l.q)} = ${fm(l.q*l.p)}</div><button onclick="oc.lines.splice(${i},1);render()">✕</button></div>`).join('')}
<div class="f" style="border:0;box-shadow:none;padding:8px 0 0;margin:0"><label class="w">محصول<select id="ol_s" onchange="olp(this.value)"><option value="">✍️ دستی (محصول ثبت‌نشده)</option>${S.prod.map(p=>`<option value="${p.id}">${esc(p.name)} · ${fm(p.price)}</option>`).join('')}</select></label><label class="w">نام آیتم<input id="ol_n"></label><label>تعداد<input id="ol_q" type="number" value="1" inputmode="decimal"></label><label>قیمت واحد<input id="ol_p" type="number" inputmode="decimal"></label><button class="w" onclick="ola()">+ افزودن آیتم</button></div></div>
<label>تخفیف<input type="number" value="${oc.disc||''}" onchange="oc.disc=N(this.value);render()"></label><label>بیعانه دریافتی<input type="number" value="${oc.dep||''}" onchange="oc.dep=N(this.value);render()"></label>
<label>روش ارسال<select onchange="oc.ship=this.value">${Sl(SH,oc.ship)}</select></label><label>تاریخ حدودی ارسال${jd('od',oc.due,"oc.due=$('#od').value")}</label>
<label>وضعیت<select onchange="oc.st=this.value">${Sl(OS,oc.st)}</select></label><label>کد رهگیری<input dir="ltr" value="${esc(oc.trk)}" onchange="oc.trk=this.value"></label><label class="w">توضیح<input value="${esc(oc.note)}" onchange="oc.note=this.value"></label>
<label class="ck w"><input type="checkbox" ${oc.full?'checked':''} onchange="oc.full=this.checked?1:0"> پرداخت کامل (فروش مستقیم)</label>
<div class="k"><small>جمع کل</small><b>${fm(t)}</b></div><div class="k"><small>باقیمانده</small><b class="rd">${fm(oc.full?0:Math.max(0,t-N(oc.dep)))}</b></div>
<button class="pri w" onclick="osv()">${oc.id?'ذخیره تغییرات':'ثبت سفارش و فاکتور'}</button>${oc.id?'<button class="w" onclick="oc=newOc();render()">انصراف</button>':''}</div>

function fp(){const p=S.prod.find(x=>x.name==$('#ln').value);if(p)$('#lp').value=p.price}
function al(){const n=$('#ln').value.trim();if(!n)return;cur.lines.push({n,q:N($('#lq').value)||1,p:N($('#lp').value)});render()}
function sb(){if(!cur.lines.length)return;const total=bt()-cur.disc,no=1000+S.invc.length+1,d=cur.d,c=cur.c.trim();
S.invc.push({id:Date.now().toString(36),no,date:d,cust:c,lines:cur.lines,disc:cur.disc,total});
S.fin.push({id:Date.now().toString(36)+'f',date:d,type:'درآمد',cat:'فروش',amt:total,note:'فاکتور #'+no});
cur.lines.forEach(l=>{const p=S.prod.find(x=>x.name==l.n);if(p){p.sold=N(p.sold)+l.q;p.stock=Math.max(0,N(p.stock)-l.q)}});
if(c&&!S.cust.some(x=>x.name==c)){S.cust.push({id:Date.now().toString(36)+'c',name:c,phone:'',note:''});sv('cust')}
['invc','fin','prod'].forEach(sv);cur={c:'',d:today(),disc:0,lines:[]};render()}
