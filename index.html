.jd{display:flex;gap:4px}.jd select{padding:6px 2px}
.bar{height:6px;background:var(--bd);border-radius:4px;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--on);padding:8px 16px;border-radius:20px;z-index:30}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;color:#000;background:#fff;padding:20px}}

<header><b>میکو آرت استودیو</b><span><small id="md"></small> <button onclick="bk()">پشتیبان</button><button onclick="$('#rf').click()">بازیابی</button><input type="file" id="rf" accept=".json" hidden onchange="rs(this)"></span></header>
<nav id="nav"></nav><main id="main"></main><div id="pr"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=v=>+v||0,fm=n=>Math.round(N(n)).toLocaleString('fa-IR'),fd=d=>{if(!d)return'';const j=g2j(...d.split('-').map(Number));return j[2].toLocaleString('fa-IR')+' '+JM[j[1]-1]+' '+j[0].toLocaleString('fa-IR',{useGrouping:false})};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334],g2=gm>2?gy+1:gy;let days=355666+365*gy+Math.floor((g2+3)/4)-Math.floor((g2+99)/100)+Math.floor((g2+399)/400)+gd+g[gm-1],jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}return[jy,days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30),1+(days<186?days%31:(days-186)%30)]}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186),gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const sal=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>sal[gm];gm++)gd-=sal[gm];return[gy,gm,gd]}
const P2=n=>String(n).padStart(2,'0');
function jd(id,iso,oc=''){const[y,m,d]=g2j(...iso.split('-').map(Number)),cy=g2j(...today().split('-').map(Number))[0],ys=[];for(let i=Math.min(cy-2,y);i<=Math.max(cy+3,y);i++)ys.push(i);const c=`onchange="jc('${id}');${oc}"`;
return `<input type="hidden" id="${id}" data-j="1" value="${iso}"><span class="jd"><select id="${id}_d" ${c}>${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${i+1==d?'selected':''}>${(i+1).toLocaleString('fa-IR')}</option>`).join('')}</select><select id="${id}_m" ${c}>${JM.map((n,i)=>`<option value="${i+1}" ${i+1==m?'selected':''}>${n}</option>`).join('')}</select><select id="${id}_y" ${c}>${ys.map(v=>`<option value="${v}" ${v==y?'selected':''}>${v.toLocaleString('fa-IR',{useGrouping:false})}</option>`).join('')}</select></span>`}
function jc(id){const y=+$('#'+id+'_y').value,m=+$('#'+id+'_m').value,d=Math.min(+$('#'+id+'_d').value,m<7?31:m<12?30:29),g=j2g(y,m,d);$('#'+id).value=g[0]+'-'+P2(g[1])+'-'+P2(g[2])}
function jset(id,iso){if(!iso)return;const j=g2j(...iso.split('-').map(Number));[['d',j[2]],['m',j[1]],['y',j[0]]].forEach(([k,v])=>{const e=$('#'+id+'_'+k);if(![...e.options].some(o=>o.value==v)){const o=document.createElement('option');o.value=o.textContent=v;e.appendChild(o)}e.value=v});$('#'+id).value=iso}
function toast(t){const e=document.createElement('div');e.className='tt';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const K=['fin','inv','cust','prod','ord','ideas','invc','set','debt'];
let S={fin:[],inv:[],cust:[],prod:[],ord:[],ideas:[],invc:[],debt:[],set:{woods:[],rate:300000,oh:15,pf:45,waste:0}};
let db=null,tab='dash',pend='',mode='ذخیره محلی',cur={c:'',d:today(),disc:0,lines:[]};
const T=[['dash','داشبورد'],['fin','مالی'],['inv','انبار'],['cust','مشتری‌ها'],['prod','محصولات'],['price','قیمت‌گذاری'],['ord','سفارش‌ها'],['bill','فاکتور'],['ideas','ایده‌ها'],['sync','همگام‌سازی']];
const OS=['جدید','در حال ساخت','آماده (منتظر تسویه)','ارسال شد','تحویل شد'],IS=['ایده','در حال بررسی','در حال اجرا','انجام شد'];
const M={
fin:{q:'amt',f:[['date','تاریخ','date'],['type','نوع',['درآمد','هزینه']],['cat','دسته',['فروش','مواد اولیه','دستمزد','اجاره','ابزار و تجهیزات','تبلیغات','ارسال','خانه و عمومی','بدهی','سایر']],['amt','مبلغ (تومان)','num'],['note','توضیح']]},
inv:{q:'name',f:[['name','نام ماده (چوب، پیچ، رنگ...)'],['unit','واحد',['متر مکعب','تخته','کیلوگرم','عدد','لیتر','متر']],['qty','مقدار خرید / موجودی','num'],['price','قیمت خرید هر واحد','num'],['date','تاریخ خرید','date'],['min','حداقل موجودی (هشدار)','num']]},
cust:{q:'name',f:[['name','نام مشتری'],['phone','شماره تماس'],['note','یادداشت']]},
prod:{q:'name',f:[['name','نام محصول'],['wood','جنس چوب'],['dim','ابعاد (سانتی‌متر)'],['wv','چوب مصرفی (سانتی‌متر مکعب)','num'],['mats','سایر مواد مصرفی'],['hrs','زمان ساخت (ساعت)','num'],['price','قیمت فروش','num'],['stock','موجودی','num'],['sold','تعداد فروخته‌شده','num'],['method','روش ساخت','area'],['tips','نکات و تکنیک‌ها','area']]},
ord:{q:'cust',f:[['cust','مشتری'],['phone','شماره تماس'],['item','محصول / سفارش'],['qty','تعداد','num'],['price','مبلغ کل','num'],['dep','بیعانه دریافتی','num'],['due','تاریخ حدودی ارسال','date'],['ship','روش ارسال',['پست','باربری','پیک','حضوری']],['trk','کد رهگیری'],['st','وضعیت',OS],['note','توضیح']]},
debt:{q:'name',f:[['name','عنوان بدهی'],['creditor','طلبکار'],['total','مبلغ کل بدهی','num'],['plan','پس‌انداز ماهانه (برنامه)','num'],['due','موعد نهایی','date'],['note','توضیح']]},
ideas:{q:'title',f:[['title','عنوان ایده / برنامه'],['st','وضعیت',IS],['note','توضیح','area']]}};
function ld(){try{const j=JSON.parse(localStorage.getItem('miko'));if(j)Object.assign(S,j)}catch(e){}}
function sv(k){try{localStorage.setItem('miko',JSON.stringify(S))}catch(e){}if(window.cloudSave)cloudSave(k)}
const inp=(k,[n,l,t])=>{const id=k+'_'+n;const e=Array.isArray(t)?`<select id="${id}">${t.map(x=>`<option>${x}</option>`).join('')}</select>`:t=='area'?`<textarea id="${id}" rows="2"></textarea>`:t=='date'?jd(id,today()):`<input id="${id}" type="${t=='num'?'number':t||'text'}" ${t=='num'?'step="any" inputmode="decimal"':''}>`;return `<label class="${t=='area'||n=='note'?'w':''}">${l}${e}</label>`};
const form=(k,x='')=>`<div class="f">${M[k].f.map(f=>inp(k,f)).join('')}${x}<input type="hidden" id="${k}_eid"><button class="pri w" onclick="${k=='inv'?'sai()':`sa('${k}')`}">ذخیره</button></div>`;
const card=(k,x,b,ex='')=>`<div class="c"><div>${b}</div><div class="ac">${ex}<button onclick="ed('${k}','${x.id}')">ویرایش</button><button class="${pend==x.id?'dng':''}" onclick="dl('${k}','${x.id}')">${pend==x.id?'مطمئنی؟':'حذف'}</button></div></div>`;
function sa(k){const o={};M[k].f.forEach(([n,l,t])=>{let v=$('#'+k+'_'+n).value;o[n]=t=='num'?N(v):v});if(!o[M[k].q])return;const id=$('#'+k+'_eid').value;
if(id){const i=S[k].findIndex(x=>x.id==id);S[k][i]={...S[k][i],...o}}else{o.id=Date.now().toString(36);S[k].push(o);if(k=='ord'&&o.dep>0){S.fin.push({id:o.id+'b',date:today(),type:'درآمد',cat:'فروش',amt:o.dep,note:'بیعانه سفارش '+o.cust});sv('fin')}}sv(k);render()}
function ed(k,id){const x=S[k].find(x=>x.id==id);M[k].f.forEach(([n,l,t])=>{const e=$('#'+k+'_'+n);if(e&&x[n]!=null){e.value=x[n];if(t=='date')jset(e.id,x[n])}});$('#'+k+'_eid').value=id;$('#'+k+'_eid').scrollIntoView({block:'center'})}
function dl(k,id){if(pend==id){S[k]=S[k].filter(x=>x.id!=id);pend='';sv(k)}else pend=id;render()}
function st(k,id,v){S[k].find(x=>x.id==id).st=v;sv(k);render()}
function go(t){tab=t;pend='';render();scrollTo(0,0)}
const fs=t=>S.fin.filter(x=>x.type==t).reduce((s,x)=>s+N(x.amt),0);
const V={};
V.dash=()=>{const c=new Date(Date.now()-30*864e5).toISOString().slice(0,10),r=S.fin.filter(x=>(x.date||'')>=c),i=r.filter(x=>x.type=='درآمد').reduce((s,x)=>s+N(x.amt),0),e=r.filter(x=>x.type=='هزینه').reduce((s,x)=>s+N(x.amt),0);
const od=S.ord.filter(o=>o.st!='تحویل شد').sort((a,b)=>(a.due||'').localeCompare(b.due||'')),low=S.inv.filter(x=>N(x.qty)<=N(x.min)),zp=S.prod.filter(p=>N(p.stock)<=0);
return `<h2>۳۰ روز اخیر</h2><div class="g"><div class="k"><small>درآمد</small><b class="gn">${fm(i)}</b></div><div class="k"><small>هزینه</small><b class="rd">${fm(e)}</b></div><div class="k"><small>سود</small><b>${fm(i-e)}</b></div></div>
<h2>سفارش‌های باز (${od.length})</h2>${od.slice(0,6).map(o=>`<div class="c"><div><b>${esc(o.cust)}</b> · ${esc(o.item)}<br><small>تحویل: ${fd(o.due)} · ${esc(o.st)}</small></div></div>`).join('')||'<small>سفارش بازی نیست</small>'}
<h2>هشدار انبار</h2>${low.map(x=>`<div class="c rd">${esc(x.name)}: ${fm(x.qty)} ${esc(x.unit)}</div>`).join('')||'<small>موردی نیست</small>'}
<h2>محصولات بدون موجودی</h2>${zp.map(p=>`<div class="c">${esc(p.name)}</div>`).join('')||'<small>موردی نیست</small>'}`};
V.fin0=()=>{const i=fs('درآمد'),e=fs('هزینه');return `<h2>حسابداری مالی</h2><div class="g"><div class="k"><small>کل درآمد</small><b class="gn">${fm(i)}</b></div><div class="k"><small>کل هزینه</small><b class="rd">${fm(e)}</b></div><div class="k"><small>تراز</small><b>${fm(i-e)}</b></div></div>`+form('fin')+[...S.fin].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>card('fin',x,`<b class="${x.type=='درآمد'?'gn':'rd'}">${fm(x.amt)}</b> <small>${esc(x.cat)} · ${fd(x.date)}</small><br>${esc(x.note)}`)).join('')};
V.inv=()=>`<h2>انبار مواد اولیه</h2>`+form('inv','<label class="ck w"><input type="checkbox" id="inv_ex" checked> ثبت خرید به‌عنوان هزینه در حسابداری</label>')+S.inv.map(x=>{const h=x.hist||[],n=h.length,ch=n>1?(h[n-1].p-h[n-2].p)/h[n-2].p*100:0;
return card('inv',x,`<b>${esc(x.name)}</b> · ${fm(x.qty)} ${esc(x.unit)} ${N(x.qty)<=N(x.min)?'<span class="rd">⚠ کم</span>':''}<br><small>آخرین قیمت: ${fm(x.price)} (${fd(x.date)}) ${n>1?`<span class="${ch>0?'rd':'gn'}">${ch>0?'↑':'↓'}${Math.abs(ch).toFixed(1)}٪</span>`:''}</small><details><summary>تاریخچه قیمت</summary>${h.map(z=>`${fd(z.d)}: ${fm(z.p)}`).join('<br>')}</details>`,`<input id="u_${x.id}" type="number" placeholder="مصرف"><button onclick="us('${x.id}')">مصرف</button>`)}).join('');
function sai(){const g=n=>$('#inv_'+n).value,nm=g('name').trim();if(!nm)return;const q=N(g('qty')),p=N(g('price')),d=g('date'),id=g('eid');let it=id?S.inv.find(x=>x.id==id):S.inv.find(x=>x.name.trim()==nm);
if(it){it.qty=id?q:N(it.qty)+q;it.unit=g('unit');it.min=N(g('min'));it.name=nm;if(p&&(!id||p!=it.price)){(it.hist=it.hist||[]).push({d,p});it.price=p;it.date=d}}
else S.inv.push({id:Date.now().toString(36),name:nm,unit:g('unit'),qty:q,min:N(g('min')),price:p,date:d,hist:p?[{d,p}]:[]});
if($('#inv_ex').checked&&!id&&q*p>0){S.fin.push({id:Date.now().toString(36)+'x',date:d,type:'هزینه',cat:'مواد اولیه',amt:q*p,note:'خرید '+nm});sv('fin')}sv('inv');render()}
function us(id){const it=S.inv.find(x=>x.id==id);it.qty=Math.max(0,N(it.qty)-N($('#u_'+id).value));sv('inv');render()}
V.cust=()=>`<h2>مشتری‌ها</h2>`+form('cust')+S.cust.map(c=>{const b=S.invc.filter(i=>i.cust==c.name),t=b.reduce((s,i)=>s+N(i.total),0);return card('cust',c,`<b>${esc(c.name)}</b> <small dir="ltr">${esc(c.phone)}</small><br><small>${esc(c.note)}</small><details><summary>خریدها (${b.length}) · مجموع ${fm(t)}</summary>${b.map(i=>`#${i.no} ${fd(i.date)}: ${i.lines.map(l=>esc(l.n)+'×'+l.q).join('، ')}`).join('<br>')}</details>`)}).join('');
V.prod=()=>`<h2>محصولات</h2>`+form('prod')+S.prod.map(p=>card('prod',p,`<b>${esc(p.name)}</b> · ${fm(p.price)} تومان<br><small>${esc(p.wood)} ${esc(p.dim)} · ${fm(p.wv)} cm³ · ${fm(p.hrs)} ساعت<br>موجودی: ${fm(p.stock)} · فروخته: ${fm(p.sold)}</small><details><summary>روش و نکات</summary><b>مواد:</b> ${esc(p.mats)}<br><b>روش:</b> ${esc(p.method)}<br><b>نکات:</b> ${esc(p.tips)}</details>`)).join('');
let fsub=0;

let cloudMsg='متصل نیست (ذخیره محلی)',fs_=null,F_=null,shadow={},ready=0,att=0,first={};
const CA=['fin','inv','cust','prod','ord','ideas','invc','debt'],ok=()=>{};
V.sync=()=>`<h2>همگام‌سازی ابری</h2><div class="f"><div class="w box">وضعیت: <b>${esc(cloudMsg)}</b></div><label class="w">تنظیمات Firebase (متن firebaseConfig)<textarea id="sc_cfg" rows="6" dir="ltr">${esc(localStorage.getItem('mikoCfgTxt')||'')}</textarea></label><label>ایمیل<input id="sc_em" type="email" dir="ltr"></label><label>رمز عبور<input id="sc_pw" type="password" dir="ltr"></label><button class="pri w" onclick="cn()">اتصال</button></div><small>فقط یک بار لازم است؛ بعد از اتصال، ورود روی گوشی ذخیره می‌شود.</small>`;
function cn(){const t=$('#sc_cfg').value,c={};[...t.matchAll(/(\w+)\s*:\s*["']([^"']+)["']/g)].forEach(m=>c[m[1]]=m[2]);
if(!c.apiKey||!c.projectId){cloudMsg='تنظیمات نامعتبر است';render();return}
localStorage.setItem('mikoCfg',JSON.stringify(c));localStorage.setItem('mikoCfgTxt',t);cloud(c,$('#sc_em').value.trim(),$('#sc_pw').value)}
const ui=()=>{try{localStorage.setItem('miko',JSON.stringify(S))}catch(e){}const a=document.activeElement;if(!a||!/INPUT|SELECT|TEXTAREA/.test(a.tagName))render()};
async function cloud(cfg,em,pw){try{cloudMsg='در حال اتصال...';render();
const B='https://www.gstatic.com/firebasejs/12.13.0/',[A,F,U]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
const app=A.getApps().length?A.getApp():A.initializeApp(cfg);
if(!F_){F_=F;fs_=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}
const au=U.getAuth(app);if(em)await U.signInWithEmailAndPassword(au,em,pw);
if(!att){att=1;U.onAuthStateChanged(au,u=>{if(u)attach();else{cloudMsg='ورود لازم است: ایمیل و رمز را وارد کن';render()}})}
}catch(e){cloudMsg='خطا: '+(e.code||e.message);render()}}
function attach(){if(ready)return;ready=1;const F=F_,loc=JSON.parse(localStorage.getItem('miko')||'{}'),mig=!localStorage.getItem('mikoSynced');let n=0;
CA.forEach(k=>F.onSnapshot(F.collection(fs_,k),sn=>{const a=[];sn.forEach(d=>a.push(d.data()));
if(mig&&!first[k])(loc[k]||[]).forEach(x=>{if(!a.some(y=>y.id==x.id)){a.push(x);F.setDoc(F.doc(fs_,k,x.id),JSON.parse(JSON.stringify(x))).catch(ok)}});
if(!first[k]){first[k]=1;if(++n==CA.length)localStorage.setItem('mikoSynced','1')}
a.sort((x,y)=>x.id<y.id?-1:x.id>y.id?1:0);S[k]=a;shadow[k]=Object.fromEntries(a.map(x=>[x.id,JSON.stringify(x)]));ui()},e=>{cloudMsg='خطا: '+(e.code||e.message);render()}));
F.onSnapshot(F.doc(fs_,'cfg','main'),d=>{if(d.exists())S.set=d.data().v;else if(mig&&loc.set&&loc.set.woods&&loc.set.woods.length){S.set=loc.set;F.setDoc(F.doc(fs_,'cfg','main'),{v:S.set}).catch(ok)}ui()});
window.cloudSave=cs;cloudMsg='متصل ✓ همگام‌سازی خودکار فعال است';mode='ابری ✓';ui()}
function cs(k){const F=F_;if(k=='set'){F.setDoc(F.doc(fs_,'cfg','main'),{v:JSON.parse(JSON.stringify(S.set))}).catch(ok);return}
const sh=shadow[k]||{},cu={};S[k].forEach(x=>{const j=JSON.stringify(x);cu[x.id]=j;if(sh[x.id]!=j)F.setDoc(F.doc(fs_,k,x.id),JSON.parse(j)).catch(ok)});
Object.keys(sh).forEach(i=>{if(!(i in cu))F.deleteDoc(F.doc(fs_,k,i)).catch(ok)});shadow[k]=cu}
try{const c=JSON.parse(localStorage.getItem('mikoCfg')||'null');if(c)cloud(c,'','')}catch(e){}
</script></body></html>
